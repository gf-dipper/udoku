<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the Rain Remembers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=Noto+Sans:wght@700&family=Noto+Sans+JP:wght@500;700&family=Patrick+Hand&family=Yomogi&family=Kalam&family=Caveat&family=Klee+One&subset=latin-ext&display=swap" rel="stylesheet">
<style>
  :root { --teal:#3fe0d0; --bg:#0b0c0f; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:#e8e7ee; font-family:'Patrick Hand', system-ui, sans-serif; }
  header { position:fixed; inset:0 0 auto 0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 16px; background:rgba(11,12,15,.85); backdrop-filter:blur(8px); border-bottom:1px solid #20222a; }
  .brand { font-size:19px; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand b { color:var(--teal); font-weight:400; }
  a.brand { color:inherit; text-decoration:none; }
  a.brand.home::before { content:'‹ '; color:#8f8d9c; }
  .end a.home { display:block; margin-top:18px; color:#8f8d9c; font-size:15px; }
  .langs { display:flex; gap:4px; flex-shrink:0; }
  header { gap:8px !important; }
  .langs button { position:relative; min-height:34px; background:#1a1c22; color:#bdbcc8; border:1px solid #2a2d36; border-radius:6px; padding:4px 10px; font:inherit; font-size:15px; cursor:pointer; }
  .langs button::after, .tools button::after, .seg button::after, .nextbar button.x::after { content:''; position:absolute; inset:-6px -2px; }
  .langs button.on { background:var(--teal); color:#071211; border-color:var(--teal); }
  .tools { display:flex; gap:4px; flex-shrink:0; margin-left:auto; }
  .tools button { position:relative; display:grid; place-items:center; width:38px; height:34px; background:#1a1c22; color:#bdbcc8; border:1px solid #2a2d36; border-radius:6px; cursor:pointer; padding:0; }
  .tools button[aria-expanded="true"] { border-color:var(--teal); color:#fff; }
  .tools svg { width:18px; height:18px; }
  .sheet { position:fixed; top:58px; right:12px; z-index:70; width:min(340px, calc(100vw - 24px)); max-height:calc(100vh - 80px); overflow:auto;
    background:#14161b; border:1px solid #2e313a; border-radius:10px; padding:14px; box-shadow:0 20px 50px rgba(0,0,0,.6); font-family:'Noto Sans', 'Noto Sans JP', sans-serif; }
  .sheet[hidden] { display:none; }
  .sheet h2 { font-size:13px; font-weight:700; color:#8f8d9c; margin:0 0 8px; letter-spacing:.02em; }
  .sheet a.chap { display:flex; gap:12px; align-items:center; padding:8px; border-radius:8px; text-decoration:none; color:#e8e7ee; }
  .sheet a.chap:hover, .sheet a.chap.on { background:#20232b; }
  .sheet a.chap img { width:72px; aspect-ratio:3/2; object-fit:cover; border-radius:4px; flex-shrink:0; }
  .sheet a.chap small { display:block; color:#8f8d9c; font-size:12px; }
  .sheet a.chap span { font-size:15px; line-height:1.3; }
  .sheet a.chap i { font-style:normal; display:block; height:3px; background:#2a2d36; border-radius:2px; margin-top:6px; overflow:hidden; }
  .sheet a.chap i b { display:block; height:100%; background:var(--teal); }
  .sheet .soon { padding:8px; color:#6f6d7c; font-size:14px; }
  .opt { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid #23262e; font-size:15px; }
  .opt:first-of-type { border-top:0; }
  .seg { display:flex; background:#1a1c22; border:1px solid #2a2d36; border-radius:8px; padding:2px; }
  .seg button { position:relative; min-width:44px; min-height:38px; background:none; border:0; color:#bdbcc8; font:inherit; font-size:14px; padding:6px 12px; border-radius:6px; cursor:pointer; }
  #segText button { line-height:1; }
  #segText button[data-v="1"] { font-size:13px; }
  #segText button[data-v="1.3"] { font-size:21px; }
  .seg button[aria-pressed="true"] { background:var(--teal); color:#071211; }
  .nextbar { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); z-index:55; transform:translate(-50%, 160%); transition:transform .35s ease;
    display:flex; align-items:center; gap:10px; width:min(560px, calc(100vw - 24px)); padding:10px 10px 10px 16px; background:rgba(20,22,27,.94); backdrop-filter:blur(8px);
    border:1px solid #2e313a; border-radius:14px; font-family:'Noto Sans', 'Noto Sans JP', sans-serif; box-shadow:0 14px 40px rgba(0,0,0,.5); }
  .nextbar.show { transform:translate(-50%, 0); }
  .nextbar span { flex:1; min-width:0; font-size:14px; color:#bdbcc8; line-height:1.3; }
  .nextbar span b { display:block; color:#e8e7ee; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nextbar a { flex-shrink:0; text-decoration:none; font-size:14px; font-weight:600; padding:10px 14px; border-radius:10px; }
  .nextbar a.go { background:var(--teal); color:#071211; }
  .nextbar a.all { color:#bdbcc8; border:1px solid #3a3d47; }
  .nextbar button.x { position:relative; flex-shrink:0; width:40px; height:40px; background:none; border:0; color:#8f8d9c; font-size:22px; cursor:pointer; padding:0; }
  .progress { position:fixed; top:0; left:0; height:3px; width:0; background:var(--teal); z-index:60; }
  main { max-width:760px; margin:0 auto; padding:80px 12px 180px; display:flex; flex-direction:column; gap:26px; }

  .title { text-align:center; padding:70px 0 50px; }
  .title .ja { font-family:'Noto Sans JP', sans-serif; font-weight:700; font-size:20px; letter-spacing:8px; color:var(--teal); }
  .title h1 { font-family:'Patrick Hand', sans-serif; font-weight:400; font-size:clamp(40px,9vw,72px); margin:8px 0 6px; line-height:1; }
  .title p { margin:0; color:#8f8d9c; font-size:18px; }
  .title .hint { margin-top:34px; font-size:22px; color:#8f8d9c; animation:bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(8px); } }

  .panel { position:relative; overflow:hidden; margin:0; container-type:inline-size; background:#000; border:3px solid #000; outline:1px solid #2a2c33; }
  .cam { position:absolute; inset:0; transform-origin:var(--zx,50%) var(--zy,50%); }
  .panel.live .cam.zoom { animation:camzoom var(--zt,6s) ease-out forwards; }
  @keyframes camzoom { to { transform:scale(var(--zs,1.06)); } }
  .layer { position:absolute; inset:-6% -4%; will-change:transform; }
  .layer img { width:100%; height:100%; object-fit:cover; display:block; user-select:none; -webkit-user-drag:none; }
  canvas.rain { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
  .flash { position:absolute; inset:0; z-index:4; opacity:0; pointer-events:none; background:#fff; }
  .panel.flashing .flash { animation:flash .6s ease-out; }
  @keyframes flash { 0% { opacity:var(--fs,.9); } 100% { opacity:0; } }
  /* reveal: a layer visible only during a lightning flash, with an afterimage */
  .layer.rev { opacity:0; }
  .panel.revealing .layer.rev { animation:revIn var(--rv,900ms) ease-out forwards; }
  .panel.revealing .layer.cover { animation:revCover var(--rv,900ms) ease-in forwards; }
  @keyframes revIn { 0%,16% { opacity:1; } 100% { opacity:0; } }
  @keyframes revCover { 0%,16% { opacity:.12; } 100% { opacity:1; } }
  body.rm .layer.rev { opacity:.28; }
  .layer.glowl { opacity:0; mix-blend-mode:screen; pointer-events:none; }
  .layer.glowl.show { animation:glowIn .8s ease-out forwards, glowPulse 2.4s ease-in-out .8s infinite; }
  @keyframes glowIn { from { opacity:0; } to { opacity:1; } }
  @keyframes glowPulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }
  body.rm .layer.glowl { opacity:.8; }
  .panel.shaking { animation:shake .45s; }
  @keyframes shake { 0%,100% { transform:none; } 20% { transform:translate(-8px,5px); } 40% { transform:translate(7px,-6px); } 60% { transform:translate(-5px,-3px); } 80% { transform:translate(3px,3px); } }
  .glint { position:absolute; z-index:2; pointer-events:none; border-radius:50%; mix-blend-mode:screen; opacity:0;
    background:radial-gradient(closest-side, rgba(63,224,208,.55), rgba(63,224,208,0)); }
  .glint.show { animation:glint 2.2s ease-in-out infinite; }
  .glint.show.once { animation:glintIn .5s ease-out forwards, glint 2.2s ease-in-out .5s infinite; }
  @keyframes glintIn { from { opacity:0; transform:scale(.4); } to { opacity:.75; transform:scale(1); } }
  @keyframes glint { 0%,100% { opacity:.15; } 50% { opacity:.75; } }

  .txt { position:absolute; z-index:6; opacity:0; }
  .bubble, .caption { color:#111; font-size:calc(clamp(13px,2.4vw,19px) * var(--ts,1)); line-height:1.2; max-width:44%;
    transform:scale(.6); transform-origin:center bottom; transition:opacity .25s, transform .35s cubic-bezier(.3,1.7,.5,1); }
  .txt.show.bubble, .txt.show.caption { opacity:1; transform:scale(1); }
  .bubble { padding:12px 18px; text-align:center; box-sizing:content-box; }
  .bubble > span { position:relative; z-index:1; white-space:pre-line; display:inline-block; }
  .bubble > svg.bl { position:absolute; left:0; top:0; overflow:visible; z-index:0; pointer-events:none; }
  .bubble > svg.bl path { fill:#fff; stroke:#111; stroke-width:2.5; stroke-linejoin:round; }
  .bubble.k-whisper > svg.bl path { stroke-dasharray:7 5; }
  .bubble.k-whisper > span { font-size:.92em; color:#333; }
  .bubble.k-radio > span { font-style:italic; letter-spacing:.5px; }
  .bubble.k-radio { padding:14px 22px; }
  .dbg-anchor { position:absolute; z-index:40; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:#ff2a2a; border:2px solid #fff; pointer-events:none; }
  .dbg-keep { position:absolute; z-index:39; border:2px dashed #ff2a2a; pointer-events:none; }
  .dbg-anchor b { position:absolute; left:12px; top:-6px; font:11px monospace; color:#fff; background:#c00; padding:0 3px; white-space:nowrap; }
  .caption { background:#f4f1e8; border:2px solid #111; padding:6px 11px; transform-origin:left top; }
  /* japán: függőleges szedés */
  body.ja .bubble, body.ja .caption { font-family:'Noto Sans JP', sans-serif; font-weight:500; writing-mode:vertical-rl; text-orientation:upright;
    max-width:none; max-height:46%; letter-spacing:1px; }
  body.ja .bubble { padding:16px 10px; }
  .sfx { font-family:'Bangers', cursive; color:var(--c,#fff); font-size:min(calc(var(--s) * 1vw), calc(var(--s) * 7.6px));
    -webkit-text-stroke:4px #111; paint-order:stroke fill; letter-spacing:3px; line-height:1; white-space:nowrap;
    transform:rotate(var(--r,0deg)) scale(.2); text-shadow:4px 4px 0 #111; }
  body.ja .sfx { font-family:'Dela Gothic One', sans-serif; letter-spacing:0; }
  .sfx.halk { -webkit-text-stroke:1.6px #18181c; text-shadow:1px 1px 0 #18181c; letter-spacing:2px; }
  .sfx.show { animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes pop { 0% { opacity:0; transform:rotate(var(--r,0deg)) scale(.2); } 60% { opacity:1; transform:rotate(var(--r,0deg)) scale(1.25); }
    100% { opacity:1; transform:rotate(var(--r,0deg)) scale(1); } }
  .hand { position:absolute; font-family:'Patrick Hand', cursive; color:#2b2b30; font-size:calc(var(--s,3) * 1cqw); line-height:1.25;
    white-space:pre; transform:rotate(var(--r,0deg)); transform-origin:left top; transition:opacity .6s; mix-blend-mode:multiply; }
  .hand s { text-decoration:none; background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20' viewBox='0 0 40 20' preserveAspectRatio='none'><path d='M1 13 L5 7 L9 14 L13 6 L17 14 L21 6 L25 13 L29 6 L33 13 L37 7 L39 11' fill='none' stroke='%2333333a' stroke-width='1.5' stroke-linejoin='round' stroke-linecap='round' opacity='.85'/></svg>") no-repeat 0 60% / 100% .55em; }
  .hand .g { display:inline-block; }
  .txt.show.hand { opacity:.92; }
  body.ja .hand { font-family:'Yomogi', 'Patrick Hand', cursive; }
  .hand.f-gondo { font-family:'Kalam', cursive; }
  .hand.f-gyerek, body.ja .hand.f-gyerek { font-family:'Yomogi', cursive; line-height:1.05; }
  .hand.f-jegyzet, body.ja .hand.f-jegyzet { font-size:calc(var(--s,3) * 1cqw * var(--ts,1)); font-family:'Noto Sans', 'Noto Sans JP', sans-serif; font-weight:400; color:#e2e2e6 !important; mix-blend-mode:normal; text-shadow:0 0 .25em #000, 0 0 .5em #000; letter-spacing:.01em; }
  .hand.f-tabla, body.ja .hand.f-tabla { font-family:'Noto Sans', 'Noto Sans JP', sans-serif; font-weight:700; letter-spacing:.02em; line-height:1.15; text-align:center; }
  body.ja .hand.f-gondo { font-family:'Klee One', 'Kalam', cursive; }
  .hand i { font-style:normal; font-family:'Caveat', cursive; font-size:1.12em; }
  .end { text-align:center; color:#8f8d9c; padding:40px 0; font-size:18px; }
  .end span { display:block; }
  .end span.soon { margin-top:10px; color:#3fe0d0; font-size:17px; }
  .end b { display:block; color:#e8e7ee; font-size:28px; margin-bottom:6px; font-weight:400; }
  .err { color:#ff8a8a; text-align:center; }
  .end a.next { display:inline-block; margin-top:22px; padding:10px 22px; border:1px solid #5d5b6a; border-radius:22px; color:#e8e7ee; text-decoration:none; font-size:17px; }
  .end a.next:hover { border-color:#e8e7ee; color:#fff; }
  .title a.prev { display:inline-block; margin-top:14px; color:#8f8d9c; font-size:14px; text-decoration:none; }
  @media (prefers-reduced-motion: reduce) {
    .panel.shaking, .panel.live .cam.zoom, .glint.show, .title .hint { animation:none !important; }
  }
  /* "Animations: off" in the settings does the same as the system setting */
  body.rm .panel.shaking, body.rm .panel.live .cam.zoom, body.rm .glint.show, body.rm .title .hint, body.rm .layer.glowl.show, body.rm .sfx.show { animation:none !important; }
  body.rm .glint.show { opacity:.55; }
  body.rm .sfx.show { opacity:1; transform:rotate(var(--r,0deg)); }
  body.rm .txt.bubble, body.rm .txt.caption { transition:opacity .2s; transform:none; }
  body.rm .panel.flashing .flash { animation-duration:1.4s; }
  body.rm .nextbar { transition:none; }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header>
  <a class="brand" id="brand" href="./">What the Rain <b>Remembers</b></a>
  <div class="tools">
    <button id="chBtn" aria-expanded="false" aria-controls="chSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <button id="setBtn" aria-expanded="false" aria-controls="setSheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 9 5l5 14M6 14h6M15 19l3.5-9 3.5 9M16.2 16h4.6"/></svg></button>
  </div>
  <div class="langs" id="langs">
    <button data-l="en">EN</button><button data-l="hu">HU</button><button data-l="ja">日本語</button>
  </div>
</header>
<div class="sheet" id="chSheet" hidden><h2 id="chHead"></h2><div id="chList"></div></div>
<div class="sheet" id="setSheet" hidden>
  <div class="opt"><span id="optText"></span><div class="seg" id="segText"><button data-v="1">A</button><button data-v="1.3">A</button></div></div>
  <div class="opt"><span id="optMotion"></span><div class="seg" id="segMotion"><button data-v="0"></button><button data-v="1"></button></div></div>
</div>
<main id="reader"></main>
<div class="nextbar" id="nextBar" role="region"><span id="nbText"></span><a class="all" id="nbAll"></a><a class="go" id="nbGo"></a><button class="x" id="nbX">×</button></div>

<script>
const UI = {
  en: { hint: 'Scroll slowly', end: 'To be continued', endSub: '', home: 'All chapters', chapters: 'Chapters', settings: 'Reading settings',
        text: 'Text size', small: 'Normal text', big: 'Larger text', motion: 'Animations', on: 'On', off: 'Off', next: 'Next', nextGo: 'Read', soon: n => `Chapter ${n} is in the works`, ch: n => `Chapter ${n}`, close: 'Close' },
  hu: { hint: 'Görgess lassan', end: 'Folytatjuk', endSub: '', home: 'Az összes fejezet', chapters: 'Fejezetek', settings: 'Olvasási beállítások',
        text: 'Betűméret', small: 'Normál szöveg', big: 'Nagyobb szöveg', motion: 'Animációk', on: 'Be', off: 'Ki', next: 'Következik', nextGo: 'Olvasás', soon: n => `A ${n}. fejezet készül`, ch: n => `${n}. fejezet`, close: 'Bezárás' },
  ja: { hint: 'ゆっくりスクロール', end: 'つづく', endSub: '', home: 'エピソード一覧', chapters: 'エピソード', settings: '表示設定',
        text: '文字サイズ', small: '標準', big: '大きめ', motion: 'アニメーション', on: 'オン', off: 'オフ', next: '次の話', nextGo: '読む', soon: n => `第${n}話 制作中`, ch: n => `第${n}話`, close: '閉じる' }
};
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let RM = matchMedia('(prefers-reduced-motion: reduce)').matches || store.get('wtrr-rm') === '1';
let TS = parseFloat(store.get('wtrr-ts') || '1') || 1; if (TS !== 1) TS = 1.3;
document.documentElement.style.setProperty('--ts', TS);
// smaller images for phones: img/m/<name> is 800 px wide, the original is used on large or very sharp screens
const SMALL = !new URLSearchParams(location.search).has('full');
let LIST = null; // chapters.json next to the reader, if there is one
let LANG = 'en';
try { LANG = localStorage.getItem('wtrr-lang') || ({ hu: 'hu', ja: 'ja' }[(navigator.language || '').slice(0, 2)] || 'en'); } catch (e) {}
// on the website the reader is <series>/read.html, next to the series page
const HOME = /\/read(\.html)?$/.test(location.pathname) ? './' : null;
const PKEY = 'prog:' + location.pathname.replace(/[^/]*$/, '');
if (HOME) { const b = document.getElementById('brand'); b.href = HOME; b.classList.add('home'); }
let SRC = 'chapter.json';
const reader = document.getElementById('reader');
let panels = [], CH = null;

const el = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
const DEBUG = new URLSearchParams(location.search).has('debug');
const tr = v => (v && typeof v === 'object') ? (v[LANG] ?? v.en) : v;

window.addEventListener('hashchange', () => { load().then(() => window.scrollTo(0, 0)); });
async function load() {
  const hm = location.hash.match(/ch=([\w.-]+\.json)/);
  const src = new URLSearchParams(location.search).get('ch') || (hm && hm[1]) || 'chapter.json'; SRC = src;
  try { CH = await (await fetch(src)).json(); }
  catch (e) { reader.innerHTML = '<p class="err">Chapter data could not be loaded.</p>'; return; }
  build();
  if (/resume/.test(location.hash)) requestAnimationFrame(() => { try {
    const st = JSON.parse(localStorage.getItem(PKEY) || '{}'); const f = st.last === src ? (st.at || 0) : ((st.p || {})[src] || 0);
    scrollTo(0, f * (document.documentElement.scrollHeight - innerHeight));
  } catch (e) {} });
}

function build() {
  panels.forEach(stop); panels = [];
  reader.innerHTML = '';
  document.body.classList.toggle('ja', LANG === 'ja'); document.body.classList.toggle('rm', RM);
  document.documentElement.lang = LANG;
  { const st = tr(CH.subtitle) || ''; document.title = (st ? st + ' · ' : '') + (tr(CH.title) || 'What the Rain Remembers'); }
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));

  const t = el('section', 'title');
  t.innerHTML = `<div class="ja">${CH.titleJa || ''}</div><h1></h1><p></p><div class="hint">↓ ${UI[LANG].hint}</div>`;
  t.querySelector('h1').textContent = tr(CH.title);
  t.querySelector('p').textContent = tr(CH.subtitle) || '';
  reader.append(t);

  CH.panels.forEach(p => {
    const fig = el('figure', 'panel'); fig.style.aspectRatio = p.aspect || '4/3'; if (p.gap) fig.style.marginTop = p.gap + 'vh';
    const cam = el('div', 'cam' + (p.zoom ? ' zoom' : ''));
    if (p.zoom) { cam.style.setProperty('--zs', p.zoom.scale || 1.06); cam.style.setProperty('--zx', (p.zoom.x ?? 50) + '%'); cam.style.setProperty('--zy', (p.zoom.y ?? 50) + '%'); cam.style.setProperty('--zt', (p.zoom.ms || 6000) + 'ms'); }
    fig.append(cam);
    const layers = p.layers.map(l => {
      const d = el('div', 'layer' + (l.reveal ? ' rev' : '') + (l.cover ? ' cover' : '') + (l.glow != null ? ' glowl' : '')); d.dataset.depth = l.depth || 0;
      if (l.reveal && l.ms) d.style.setProperty('--rv', l.ms + 'ms'); if (l.cover && l.ms) d.style.setProperty('--rv', l.ms + 'ms');
      const img = el('img'); if (SMALL && /^img\/[^/]+\.webp$/.test(l.src)) { img.srcset = l.src.replace('img/', 'img/m/') + ' 800w, ' + l.src + ' 1600w'; img.sizes = '(max-width: 780px) 100vw, 760px'; } img.src = l.src; img.alt = l.alt || ''; img.loading = 'lazy'; img.decoding = 'async';

      loadList().then(l => { const c = l.chapters.find(x => x.src === CH.next.src); if (c) t.lastChild.textContent = u.ch(n) + ': ' + chTitle(c.data); });
    } else { go.hidden = true; t.innerHTML = '<b></b><span></span>'; t.firstChild.textContent = tr(CH.endTitle) || u.end;
      loadList().then(l => { if (l.next) t.lastChild.textContent = u.soon(l.next.n); }); }
    all.hidden = !HOME || !!CH.next; if (HOME) { all.href = HOME + '#chapters'; all.textContent = u.home; }
  }
  bar.classList.toggle('show', show);
}
load();
</script>
